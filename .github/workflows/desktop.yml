# /*!***************************************************************************
# \file       desktop.yml
# \author     m.quah
# \par        m.quah@digipen.edu
# \date       13/07/2026
# \brief
#     Builds the shared Fan3D desktop project on Linux and Windows.
# ***************************************************************************/

name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    name: "Desktop - ${{ matrix.name }} - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: ., name: Assignment-2-3DFan, os: ubuntu-latest  }
          - { project: ., name: Assignment-2-3DFan, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      # Linux-only dependencies used by GLFW.
      - name: Install OpenGL, X11 and Wayland headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/build_ci/_deps
          key: cmake-deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(format('{0}/cmake/ImportDependencies.cmake', matrix.project)) }}
          restore-keys: cmake-deps-${{ runner.os }}-${{ matrix.name }}-

      # Ninja avoids Visual Studio instance-discovery issues on hosted runners.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: CMake configure (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ matrix.project }}
        run: cmake -S . -B build_ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: CMake configure (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ matrix.project }}
        run: cmake -S . -B build_ci -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: CMake build
        working-directory: ${{ matrix.project }}
        run: cmake --build build_ci --config Release --parallel
